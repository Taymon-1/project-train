<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,
      maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Train">
<title>Train</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #14110f; color: #e8e2dc;
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid #2e2823;
    font-weight: 600; letter-spacing: .3px; color: #c96a4a;
  }
  #log { flex: 1; overflow-y: auto; padding: 14px 12px; }
  .row { display: flex; margin-bottom: 10px; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 17px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .me .bubble { background: #2f4858; border-bottom-right-radius: 5px; }
  .her .bubble { background: #2a221d; border-bottom-left-radius: 5px; }
  .sys { text-align: center; color: #6d635b; font-size: 14px; margin: 8px 0; }
  form { display: flex; gap: 8px; padding: 10px 12px;
         border-top: 1px solid #2e2823; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 20px; border: none;
    background: #241e1a; color: #e8e2dc; font-size: 17px;
  }
  input:focus { outline: 1px solid #c96a4a; }
  button {
    padding: 11px 18px; border-radius: 20px; border: none;
    background: #c96a4a; color: #14110f; font-size: 17px; font-weight: 600;
  }
  button:disabled { opacity: .45; }
</style>
</head>
<body>
<header>Train Jules</header>
<div id="log"></div>
<form id="f">
  <input id="m" placeholder="Say something..." autocomplete="off">
  <button id="b" type="submit">Send</button>
</form>
<script>
  var log = document.getElementById('log');
  var form = document.getElementById('f');
  var box = document.getElementById('m');
  var btn = document.getElementById('b');
  var pass = localStorage.getItem('trainpass') || '';

  function add(who, text) {
    var row = document.createElement('div');
    row.className = 'row ' + who;
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function note(text) {
    var d = document.createElement('div');
    d.className = 'sys';
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function askPass() {
    var p = prompt('Password');
    if (p) { pass = p; localStorage.setItem('trainpass', p); loadHistory(); }
  }

  function loadHistory() {
    fetch('/history?p=' + encodeURIComponent(pass))
      .then(function (r) {
        if (r.status === 403) { localStorage.removeItem('trainpass');
                                askPass(); return null; }
        return r.json();
      })
      .then(function (d) {
        if (!d) return;
        log.innerHTML = '';
        d.lines.forEach(function (l) { add(l.who, l.text); });
        if (!d.lines.length) note('Say hello.');
      })
      .catch(function () { note('Cannot reach Train.'); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = box.value.trim();
    if (!text) return;
    if (!pass) { askPass(); return; }
    box.value = '';
    add('me', text);
    btn.disabled = true;
    fetch('/say', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass, message: text })
    })
      .then(function (r) {
        if (r.status === 403) { localStorage.removeItem('trainpass');
                                pass = ''; note('Wrong password.'); return null; }
        return r.json();
      })
      .then(function (d) { if (d) add('her', d.reply); })
      .catch(function () { note('Message did not get through.'); })
      .then(function () { btn.disabled = false; box.focus(); });
  });

  if (!pass) { askPass(); } else { loadHistory(); }
</script>
</body>
</html>
